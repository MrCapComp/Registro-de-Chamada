<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Chamadas</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Poppins', sans-serif;
        }

        main.container {
            flex: 1;
        }

        .top-header {
            position: relative;
            background-color: #064e32;
            color: #ffffff;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 32px;
            box-sizing: border-box;
        }

        .site-title {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            white-space: nowrap;
            text-align: center;
            max-width: calc(100% - 220px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0;
        }

        .site-logo {
            width: 96px;
            height: 96px;
            object-fit: cover;
            border-radius: 8px;
            background: transparent;
        }

        @media (max-width: 768px) {
            .site-logo {
                width: 48px;
                height: 48px;
            }

            .site-title {
                font-size: 1rem;
                max-width: calc(100% - 140px);
            }

            .top-header {
                padding: 10px 12px;
            }
        }

        .header-actions {
            min-width: 120px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            color: #ffffff;
        }

        .titulo-principal h1,
        .formulario-ticket h2 {
            padding-left: 32px;
            padding-right: 32px;
            margin-top: 0.2rem;
            margin-bottom: 1rem;
        }

        .bottom-header {
            margin-top: 0;
            background-color: #064e32;
            color: #ffffff;
            width: 100%;
            text-align: center;
            padding: 20px;
        }

        .formulario-ticket h2 {
            background-color: #e8f5ee;
            color: #064e32;
            border-left: 6px solid #064e32;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 0 0 16px 0;
            font-size: 1.125rem;
            box-shadow: 0 2px 6px rgba(6, 78, 50, 0.05);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .formulario-ticket h2 img {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            object-fit: cover;
        }

        @media (max-width: 768px) {
            .formulario-ticket h2 {
                padding: 10px;
                font-size: 1rem;
                gap: 8px;
            }

            .formulario-ticket h2 img {
                width: 24px;
                height: 24px;
            }
        }

        .form-group {
            background: #ffffff;
            border: 1px solid rgba(6, 78, 50, 0.08);
            border-left: 6px solid rgba(6, 78, 50, 0.15);
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-group label img {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            object-fit: cover;
        }

        .form-group input[type="text"],
        .form-group input[type="datetime-local"],
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-shadow: none;
            background: transparent;
            font-size: 0.98rem;
        }

        .form-group.nivel-periculosidade {
            margin-bottom: 12px;
        }

        .form-group.nivel-periculosidade textarea {
            height: 80px;
        }

        @media (max-width: 768px) {
            .formulario-ticket h2 {
                padding: 10px 12px;
                font-size: 1rem;
            }

            .form-group {
                padding: 10px 12px;
            }

            .form-group input[type="text"],
            .form-group input[type="datetime-local"],
            .form-group textarea,
            .form-group select {
                padding: 9px 10px;
                font-size: 0.95rem;
            }
        }

        #registros-container {
            position: fixed;
            top: 100px;
            right: 20px;
            width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 1000;
        }

        .registro {
            background-color: #e8f5ee;
            border-left: 6px solid #064e32;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <header class="top-header">
        <div class="logo-container">
            <img src="./img.jpeg/unnamed (2).jpg" alt="Logo" class="site-logo">
            <h1 class="site-title">Registro de Chamadas</h1>
        </div>
        <div class="header-actions">
        </div>
    </header>

    <main class="container">
        <div id="registros-container" style="margin-bottom: 20px;"></div>

        <section class="barra-funcionalidade formulario-ticket">
            <h2><img src="./img.jpeg/Telefone e +.jpg" alt="Logo" class="site-logo">Registrar Nova Chamada</h2>

            <form action="#" method="POST" onsubmit="registrarChamada(event)">
                <div class="form-group">
                    <label for="nome"><img src="./img.jpeg/Usuario new.jpg" alt="Ícone">Nome do zépovin :</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Ana Maria Silva">
                </div>

                <div class="form-group">
                    <label for="data-hora"><img src="./img.jpeg/Relogio.jpg" alt="Ícone">Data e Hora da
                        Chamada:</label>
                    <input type="datetime-local" id="data-hora" name="data-hora" required>
                </div>

                <div class="form-group nivel-periculosidade">
                    <label for="descricao"><img src="./img.jpeg/Nivel.jpg" alt="Ícone">Nível de Periculosidade:</label>
                    <textarea id="descricao" name="descricao" rows="3" required
                        placeholder="Detalhes da chamada..."></textarea>
                </div>

                <div class="form-group">
                    <label for="setor"><img src="./img.jpeg/Escolamento.jpg" alt="Ícone">Setor de Escalonamento:</label>
                    <select id="setor" name="setor" required>
                        <option value="suporte_n1">Suporte Nível 1</option>
                        <option value="suporte_n2">Suporte Nível 2</option>
                        <option value="desenvolvimento">Desenvolvimento</option>
                        <option value="infraestrutura">Infraestrutura</option>
                    </select>
                </div>

                <div class="actions">
                    <button type="submit" class="submit-button">Registrar Chamada</button>
                    <button type="button" class="escalate-button"
                        onclick="alert('Chamada escalonada para o setor selecionado!');">Escalonar Chamada</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="bottom-header">
        <p>&copy; 2025 Registro de Chamadas. se copia vai ser ripa sem dó.</p>
    </footer>

    <script>
        function registrarChamada(event) {
            event.preventDefault();

            const nome = document.getElementById('nome').value;
            const dataHora = document.getElementById('data-hora').value;
            const nivel = document.getElementById('descricao').value;
            const setor = document.getElementById('setor').value;

            const registroDiv = document.createElement('div');
            registroDiv.className = 'registro';
            const dataFormatada = new Date(dataHora).toLocaleString('pt-BR');

            registroDiv.innerHTML = `
                <h3 style="color: #064e32; margin-bottom: 10px;">Registro de Chamada</h3>
                <p><strong>Nome:</strong> ${nome}</p>
                <p><strong>Data e Hora:</strong> ${dataFormatada}</p>
                <p><strong>Nível de Periculosidade:</strong> ${nivel}</p>
                <p><strong>Setor:</strong> ${setor}</p>
            `;

            const container = document.getElementById('registros-container');
            container.insertBefore(registroDiv, container.firstChild);
            event.target.reset();
        }
    </script>
</body>

</html>
